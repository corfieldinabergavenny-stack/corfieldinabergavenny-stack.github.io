<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#141414" />
<title>Welsh Pantry · Rarebit Crust pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #141414;
  --ink-2: #1c1c1c;
  --paper: #f4efe6;
  --paper-2: #ebe4d6;
  --brand: #c8102e;
  --muted: #6b6560;
  --display: "Fraunces", "Times New Roman", serif;
  --sans: "Outfit", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); font-family: var(--sans); }
button:not(:disabled), [role="button"] { cursor: pointer; }
[contenteditable="true"] { outline: none; }
[contenteditable="true"]:hover { box-shadow: inset 0 0 0 1px rgba(200,16,46,.35); }
[contenteditable="true"]:focus { box-shadow: inset 0 0 0 2px var(--brand); }
#app { min-height: 100dvh; display: flex; flex-direction: column; }
header, footer.bar { flex: 0 0 auto; }
header {
  display: flex; align-items: center; gap: 12px;
  height: 56px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.1);
  background: var(--ink);
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 4px; background: var(--brand);
  display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 15px;
}
.brand-name { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.1; }
.brand-sub { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(244,239,230,.55); margin-top: 2px; }
.grow { flex: 1; }
.nav { display: flex; align-items: center; gap: 4px; }
.iconbtn, .btn {
  border: 0; background: transparent; color: var(--paper);
  min-height: 40px; padding: 0 12px; border-radius: 8px; font-family: var(--sans); font-size: 14px;
}
.iconbtn { width: 40px; padding: 0; font-size: 18px; }
.iconbtn:hover, .btn:hover { background: rgba(255,255,255,.08); }
.btn.brand { background: var(--brand); font-weight: 600; padding: 0 16px; }
.btn.brand:hover { background: #9b0c24; }
.count { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; color: rgba(244,239,230,.7); }
main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
.stage-wrap { width: min(100%, 1280px); aspect-ratio: 16/9; max-height: 100%; }
.stage {
  width: 1280px; height: 720px; transform-origin: top left;
  overflow: hidden; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.45);
}
.slide { width: 1280px; height: 720px; position: relative; overflow: hidden; }
.slide.ink { background: var(--ink); color: var(--paper); }
.slide.paper { background: var(--paper); color: var(--ink); }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--brand); }
.slide.paper .kicker { color: #9b0c24; }
.rule { height: 4px; width: 64px; background: var(--brand); }
.foot {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between; padding: 16px 40px;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
}
.slide.ink .foot { color: rgba(244,239,230,.45); }
.slide.paper .foot { color: var(--muted); }
.photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.title-grid { display: grid; grid-template-columns: 1.05fr .95fr; height: 100%; }
.title-copy { display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px; }
.title-copy h1 { font-family: var(--display); font-size: 86px; font-weight: 600; line-height: .9; letter-spacing: -.03em; margin: 12px 0; }
.title-copy .sub { font-family: var(--display); font-size: 32px; font-weight: 500; max-width: 18ch; margin: 12px 0 0; }
.title-copy .body { max-width: 42ch; color: rgba(244,239,230,.7); line-height: 1.5; font-size: 16px; }
.facts { display: flex; gap: 32px; padding-bottom: 32px; }
.facts strong { display: block; font-family: var(--display); font-size: 26px; }
.facts span { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: rgba(244,239,230,.5); }
.photo-col { position: relative; }
.badge { position: absolute; bottom: 40px; right: 32px; background: var(--brand); color: var(--paper); padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
.split { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
.split-copy { padding: 40px 48px 56px; display: flex; flex-direction: column; }
.split-copy h1, .pad h1, .close-inner h1 {
  font-family: var(--display); font-size: 44px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; margin: 8px 0 12px;
}
.split-copy .sub, .pad .sub { font-size: 18px; line-height: 1.4; color: var(--muted); margin: 0 0 20px; }
.bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.bullets li { display: flex; gap: 12px; font-size: 16px; line-height: 1.45; }
.n { color: var(--brand); font-family: var(--display); font-weight: 600; min-width: 1.4em; }
.pad { padding: 40px 48px 56px; height: 100%; display: flex; flex-direction: column; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
.card { background: #fffdf9; border: 1px solid #ddd4c6; border-radius: 12px; padding: 20px 22px; }
.card .ck { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #9b0c24; }
.card h3 { font-family: var(--display); font-size: 22px; margin: 6px 0 8px; }
.card p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); }
.quid { display: grid; grid-template-columns: 1.15fr .85fr; height: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid #ddd4c6; }
td { padding: 8px 10px; border-bottom: 1px solid #eee6da; vertical-align: top; }
.pack { display: grid; grid-template-columns: .95fr 1.05fr; height: 100%; }
.pack-copy { padding: 40px 40px 56px; }
.pack-copy h1 { font-family: var(--display); font-size: 48px; font-weight: 600; line-height: .95; margin: 8px 0 12px; }
.pack-copy .sub { font-size: 18px; color: rgba(244,239,230,.75); margin-bottom: 16px; }
.pack-copy .body { color: rgba(244,239,230,.7); line-height: 1.5; margin-bottom: 20px; }
.pack-visual { position: relative; }
.pack-visual img { width: 100%; height: 100%; object-fit: cover; }
.close { height: 100%; display: grid; grid-template-columns: 1.1fr .9fr; }
.close-inner { padding: 48px; display: flex; flex-direction: column; justify-content: center; }
.close-inner h1 { font-size: 64px; }
.close-inner .sub { font-size: 22px; color: rgba(244,239,230,.8); margin-bottom: 16px; }
.close-inner .body { color: rgba(244,239,230,.7); max-width: 42ch; margin-bottom: 24px; }
.factrow { display: flex; gap: 28px; margin-top: auto; padding-bottom: 28px; }
.factrow strong { font-family: var(--display); font-size: 28px; display: block; }
.factrow span { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.slide.ink .factrow span { color: rgba(244,239,230,.5); }
.hint { text-align: center; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: rgba(244,239,230,.35); padding: 0 16px 10px; }
.notes {
  max-height: 120px; overflow: auto; padding: 12px 20px; border-top: 1px solid rgba(255,255,255,.1);
  background: var(--ink-2); font-size: 14px; line-height: 1.5; color: rgba(244,239,230,.8);
}
.overlay {
  position: fixed; inset: 0; background: rgba(20,20,20,.8); z-index: 50;
  display: flex; align-items: flex-end; justify-content: flex-end; padding: 16px;
}
.panel {
  width: min(100%, 520px); max-height: 85dvh; overflow: auto;
  background: var(--ink-2); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 20px 24px;
}
.panel h2 { font-family: var(--display); margin: 0 0 12px; }
.panel dt { font-family: var(--display); font-size: 17px; margin-top: 16px; }
.panel dd { margin: 6px 0 0; color: rgba(244,239,230,.7); font-size: 14px; line-height: 1.5; }
body.presenting header, body.presenting .hint, body.presenting .notes { display: none; }
body.presenting main { padding: 0; background: #000; }
body.presenting .stage { box-shadow: none; }
.click-left, .click-right {
  display: none; position: fixed; top: 0; bottom: 0; width: 28%; z-index: 40;
}
body.presenting .click-left, body.presenting .click-right { display: block; }
.click-left { left: 0; }
.click-right { right: 0; }
@media print {
  @page { size: landscape; margin: 0; }
  header, .hint, .notes, .overlay, .click-left, .click-right, #app { display: none !important; }
  #printAll { display: block !important; }
  #printAll .slide { page-break-after: always; break-after: page; width: 100vw; height: 100vh; }
}
#printAll { display: none; }
@media (max-width: 700px) {
  header { height: 52px; padding: 0 8px; }
  .brand-name, .brand-sub { display: none; }
  .btn.brand { padding: 0 12px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand-mark">W</div>
    <div>
      <div class="brand-name">The Welsh Pantry</div>
      <div class="brand-sub">Llantrisant · Rarebit Crust</div>
    </div>
    <div class="grow"></div>
    <div class="nav">
      <button class="iconbtn" id="prev" aria-label="Previous">‹</button>
      <span class="count" id="count">1 / 11</span>
      <button class="iconbtn" id="next" aria-label="Next">›</button>
      <button class="btn" id="notesBtn">Notes</button>
      <button class="btn" id="cribBtn">Q&A</button>
      <button class="btn" id="printBtn">Print / Save as PDF</button>
      <button class="btn brand" id="presentBtn">Present</button>
    </div>
  </header>
  <main>
    <div class="stage-wrap" id="wrap">
      <div class="stage" id="stage"></div>
    </div>
  </main>
  <p class="hint">Click any text to edit · arrows or swipe to move · Present for Thursday</p>
  <div class="notes" id="notes" hidden></div>
</div>
<div class="click-left" id="hitPrev"></div>
<div class="click-right" id="hitNext"></div>
<div class="overlay" id="crib" hidden>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Likely questions</h2>
      <button class="iconbtn" id="cribClose">✕</button>
    </div>
    <dl id="cribList"></dl>
  </div>
</div>

const START = {"deck":{"version":2,"title":"The Welsh Pantry · Retail Pitch","presenter":"NPD presentation","audience":"Retail partner","slides":[{"id":"title","layout":"title","theme":"ink","kicker":"Confidential  ·  Retail NPD pitch","title":"Rarebit Crust","subtitle":"Welsh Beef & Glamorgan Pale Ale Pie","body":"A luxury individual pie for the chilled cabinet — heritage flavour, a clear on-pack hook, and a recipe that will run on the Llantrisant pie line.","bullets":[],"cards":[],"facts":[{"value":"250g","label":"Individual portion"},{"value":"Luxury","label":"Chilled tier"},{"value":"100%","label":"Welsh beef"}],"image":"/images/pie-hero.jpg","imageAlt":"Welsh beef and ale pie with a golden rarebit crust","quid":[],"table":null,"notes":"Open on the name, not the company history. Pause on ‘Rarebit Crust’ — that is the call-out the buyer will remember. Then one sentence on who we are: The Welsh Pantry, Llantrisant, pitching as a branded / own-label partner. Offer the foil-baked prototype and the separate filling pot at the end, not now."},{"id":"agenda","layout":"agenda","theme":"paper","kicker":"Today","title":"What we will cover","subtitle":"A retailer-ready NPD, not a chef’s special.","body":"","bullets":["The gap in chilled savoury — premium comfort, not fusion.","The product: rarebit puff lid, Welsh chuck, neighbour ale.","Pack, call-outs and the 250g individual.","QUID, pastry system and how it runs on our pie line.","Shopper, occasion, RSP and range fit.","Why Llantrisant can make this at scale — and the tasting."],"cards":[],"facts":[],"image":"","imageAlt":"","quid":[],"table":null,"notes":"Keep this to 20 seconds. If the panel is short on time, skip and go straight to pack. Do not apologise for the structure — it maps to a standard retail NPD brief: concept, provenance, cut, shopper, serving size, factory."},{"id":"pack","layout":"pack","theme":"ink","kicker":"The concept  ·  Slide 3","title":"What the shopper sees","subtitle":"Windowed black sleeve, foil tray, rarebit lid in full view. One call-out. One provenance claim.","body":"Tender Welsh beef chuck and caramelised shallots, slow-cooked in Glamorgan pale ale, finished with a mature cheddar and wholegrain mustard rarebit crust.","bullets":["Call-out: Rarebit crust — cheddar & wholegrain mustard.","Provenance flash: Made with 100% Welsh Beef.","Format: 250g e individual, foil-baked for the factory."],"cards":[],"facts":[],"image":"/images/pack.jpg","imageAlt":"Windowed black sleeve showing the rarebit-crust pie in a foil tray","productName":"Welsh Beef & Glamorgan Ale Pie","quid":[],"table":null,"notes":"This is the money slide. Walk the pack like a buyer: window shows the lid (the USP is visual), black/red/white signals luxury vs a blue everyday box, 250g is dine-in not family. If they ask about traffic lights, the brief said nutrition is out of scope — park it and offer to follow up with a spec."},{"id":"opportunity","layout":"cards","theme":"paper","kicker":"The opportunity","title":"Comfort still pays the bills","subtitle":"World-cuisine headlines are loud. Traditional recipes still take the volume.","body":"We are not launching a curry pie. We are taking a hero steak-and-ale and giving it a Welsh, premium reason to exist.","bullets":[],"cards":[{"kicker":"Volume","title":"Heritage wins the till","body":"Traditional recipes such as All Steak and Chicken & Mushroom still account for around 58% of retail sales for major pie brands. The shopper has not left steak and ale."},{"kicker":"Premium","title":"Own-label is trading up","body":"Kantar has shown premium own-label growing around 9%, with shoppers concentrating spend on better meat and proper comfort food — exactly this territory."},{"kicker":"Brand fit","title":"Welsh Pantry is not fusion","body":"Under this brand the shopper expects authenticity and provenance. Rarebit on a steak pie is a nudge, not a leap. It photographs. It talks on pack."},{"kicker":"White space","title":"A luxury step-up, not a new category","body":"We already make 235g steak and steak & ale. This sits above them as a Finest-style individual — same cabinet, higher RSP, a distinct lid."}],"facts":[],"image":"","imageAlt":"","quid":[],"table":null,"notes":"If challenged on ‘why not tikka / balti’: we already have those in slices. The brief is a steak pie. Fusion is a trend story; steak and ale is the volume engine. Rarebit is the differentiator that still reads as British. Cite Pukka-style mix and Kantar premium own-label, then move on."},{"id":"product","layout":"split","theme":"paper","kicker":"The product","title":"Restaurant lid. Factory base.","subtitle":"The rarebit is the hook. The shortcrust is how we sleep at night on a high-speed line.","body":"","bullets":["Lid: rarebit rough puff — mature Welsh cheddar folded through, Welsh Lady wholegrain mustard, ice-cold Glamorgan pale ale as the liquid, Welsh egg glaze.","Base: robust shortcrust in the foil. Protects against a soggy bottom and keeps the existing pie-line tooling.","Filling: Welsh chuck, slow-braised in pale ale with caramelised shallots, leeks, carrots, onion and thyme. Collagen from the cut naturally thickens the gravy.","Cut rationale: chuck (or shin) is a working muscle. On a long ale braise it becomes sticky and luxurious, and the protein cost protects margin versus a leaner roasting cut."],"cards":[],"facts":[],"image":"/images/filling.jpg","imageAlt":"Slow-braised Welsh chuck in pale ale gravy with leeks and shallots","quid":[],"table":null,"notes":"Have the filling pot ready. Talk mouthfeel: collagen, not flour-heavy gravy. If they push on cheddar in puff: lid only, microplane the cheese, extra rest between turns, watch bake colour. Butter is pulled back slightly to compensate for cheese fat. Ratios are on the Q&A crib."},{"id":"quid","layout":"quid","theme":"paper","kicker":"Mock specification","title":"Ingredients, QUID & provenance","subtitle":"Indicative 250g build. Final QUID to be locked with Technical after a factory trial.","body":"Every hero ingredient is Welsh. Glamorgan Brewing sits on Llantrisant Business Park — the ale is a neighbour, not a story we bought in.","bullets":[],"cards":[],"facts":[],"image":"/images/ingredients.jpg","imageAlt":"Cheddar, mustard, pale ale, leeks and chuck on slate","quid":[{"name":"Welsh beef chuck","pct":"26%","origin":"Wales · QUID hero"},{"name":"Wheat flour (base & lid)","pct":"22%","origin":"UK mill"},{"name":"Water & ale gravy","pct":"18%","origin":"Glamorgan pale ale 4%"},{"name":"Butter & pastry fats","pct":"12%","origin":"Lid laminated; base short"},{"name":"Shallot, leek, carrot, onion","pct":"10%","origin":"Leek as the Welsh note"},{"name":"Mature Welsh cheddar","pct":"4%","origin":"In the rarebit lid"},{"name":"Welsh Lady mustard, thyme, egg","pct":"3%","origin":"Mustard in pastry & filling"},{"name":"Seasoning & glaze","pct":"5%","origin":"Welsh egg + ale wash"}],"table":null,"notes":"Stress these are mock figures for the pitch, not a locked spec. 26% beef is a premium steak-pie declaration. Shallots not white onions is a quality cue for RSP. If Technical asks about allergens: gluten, milk, egg, mustard, barley (ale). Red Tractor / Welsh beef claim to be evidenced at pack-off."},{"id":"factory","layout":"factory","theme":"paper","kicker":"Makeability","title":"It has to run at Llantrisant","subtitle":"Foil-baked on the automated pie line. The rarebit lives on the lid so the base stays factory-true.","body":"","bullets":["Tray: individual foil — the same language as retail, and we can lift it in the tasting to show base integrity.","Deposit: existing gravy and dice systems; filling viscosity set by the braise, not a heavy starch load.","Lid: rarebit puff sheeted, rested cold, cut and applied. Cheese is finely grated into the dry mix so it does not tear lamination.","Bake: cheese browns faster — slightly lower colour target, egg-and-ale glaze, tight oven window.","Pack: cool, then windowed carton sleeve. Foil remains the primary bake vessel."],"cards":[],"facts":[{"value":"7,200","label":"Small pies / hour"},{"value":"2,880","label":"Family pies / hour"},{"value":"~50%","label":"Site still free"}],"image":"/images/bakery.jpg","imageAlt":"Automated pie line at a modern bakery","quid":[],"table":null,"notes":"This answers the brief’s factory question. You have thought like Operations, not only like a chef. Mention the test kitchen can replicate the line. If they ask about yield: extra rest on the rarebit dough, not extra handling. Capacity numbers are from the Llantrisant site — 7,200 small pies an hour, site only half used."},{"id":"shopper","layout":"cards","theme":"paper","kicker":"Shopper, occasion, serve","title":"Who it is for, and when it is eaten","subtitle":"Luxury-tier individual. Weekend comfort. A meal-deal hero.","body":"","bullets":[],"cards":[{"kicker":"Who","title":"The premium comfort shopper","body":"25–54, cooking a proper Friday or Saturday night in. They will pay more for named beef and a crust they have not seen before. Not a food-to-go grab."},{"kicker":"Serve","title":"250g individual","body":"A generous single portion. Two in a basket with mash and greens becomes dinner. Distinct from our 550g family pie and the 235g core steak line."},{"kicker":"Occasion","title":"Dine-in for two","body":"Built for the £12-style premium dine-in mechanic: two pies, a premium mash or dauphinoise, a bottle of wine or two ales. Autumn/winter drop."},{"kicker":"Moments","title":"A calendar that works","body":"St David’s Day, Father’s Day, Bonfire, Christmas chilled, and a core winter range slot. Rarebit is a seasonal story that can stay listed."}],"facts":[],"image":"","imageAlt":"","quid":[],"table":null,"notes":"Be precise if asked ‘who is the end customer’: premium at-home, not student, not foodservice. Serving size 230–250g as discussed. Occasion is weekend dine-in and celebration weeks, not lunchtime. If they want a family SKU later, that is a phase-two 550g with the same lid."},{"id":"commercials","layout":"table","theme":"paper","kicker":"Commercials  ·  indicative","title":"Range architecture & RSP","subtitle":"A luxury step-up on a line we already know how to sell. Figures are pitch numbers, not a costed quote.","body":"Core steak pies hold volume. This SKU earns the cabinet more per facing and gives the buyer a story for Finest / Taste the Difference / Collection.","bullets":[],"cards":[],"facts":[],"image":"","imageAlt":"","quid":[],"table":{"headers":["Line","Format","Role","Indicative RSP"],"rows":[["Steak pie (existing)","235g foil","Core volume","Everyday"],["Steak & ale (existing)","235g foil","Core volume","Everyday +"],["Rarebit crust beef & ale","250g foil + sleeve","Luxury step-up","£3.40–£3.75"],["Family steak & ale","550g","Share / Sunday","Family"],["Dine-in for two mechanic","2 × 250g + sides","Weekend event","c. £12 basket"]]},"notes":"Do not defend a single penny. Give a band: £3.40–£3.75. Chuck vs rump is how we protect margin. Sleeve is the luxury cue; foil is the cost reality. If they want a £2.50 ticket, the rarebit lid and 26% beef do not survive — walk away from that brief politely."},{"id":"why","layout":"factory","theme":"paper","kicker":"Why The Welsh Pantry","title":"A Welsh-class factory, with room to grow","subtitle":"100,000 sq ft in Llantrisant. BRC Grade A+. Neighbour ale. An NPD kitchen that can take this from slate to line.","body":"","bullets":["Privately owned bakery, founded 1988, on Llantrisant Business Park since 2011.","Fully automated pie line after a £2.5m bakery extension — 7,200 small pies an hour.","BRC accreditation at the top grade; Red Tractor; in-house Technical and a test kitchen that mirrors the plant.","Site still only around half utilised — listings do not wait on a capex story.","Glamorgan Brewing is on the same park. The ale in the gravy has a genuine local supply story."],"cards":[],"facts":[{"value":"1988","label":"Established"},{"value":"100k","label":"Sq ft, Llantrisant"},{"value":"A+","label":"BRC grade"}],"image":"/images/pie-hero.jpg","imageAlt":"Finished rarebit crust pie on slate","quid":[],"table":null,"notes":"You are presenting as The Welsh Pantry, not as a freelance chef. Use ‘we’. Do not over-claim turnover. Capacity, grade, location and the brewery next door are the four facts that matter. If asked about Indigo Food Group: owner since 2010 — keep it one clause unless they push."},{"id":"close","layout":"close","theme":"ink","kicker":"Next step","title":"Taste it. Then trial it.","subtitle":"Foil-baked prototype on the table. Filling in a separate pot so you can judge the gravy on its own.","body":"We are asking for a factory trial and a listing conversation on the luxury 250g — branded or retailer collection, your call.","bullets":["Prototype: foil-baked today, base shown out of tray.","Filling pot: viscosity, beef, ale.","Ask: technical trial on the Llantrisant pie line."],"cards":[],"facts":[],"image":"/images/pie-hero.jpg","imageAlt":"The finished pie, ready to taste","quid":[],"table":null,"notes":"Stop talking. Hand over the pie, then the filling. When they speak, listen. If they like the lid, offer a line trial. If they like the filling but worry about pastry, offer a shortcrust lid as a fallback — but fight for rarebit first. Thank them. Leave a one-pager of the QUID and RSP band."}]},"crib":[{"q":"Why chuck, not rump or brisket?","a":"Chuck (or shin) is collagen-rich. A long pale-ale braise melts that to a sticky gravy without drowning the filling in starch. It also holds the protein cost so a 26% QUID still makes a luxury RSP. Rump is too lean and too dear for this format."},{"q":"Why not a curried or ‘world’ pie? That is what the trend decks say.","a":"Trend decks talk growth; the till still rings on steak and chicken & mushroom — around 58% of sales for the big brands. The Welsh Pantry shopper is buying heritage. Rarebit is the twist that stays inside that promise."},{"q":"Cheese in puff will wreck the line.","a":"Agreed if it is in the base. We keep a standard shortcrust in the foil and put the rarebit only in the lid. Cheese is microplaned into the dry mix, dough is rested colder and longer, and we accept a slightly faster bake colour."},{"q":"What is the rarebit pastry ratio?","a":"On 250g flour: 200g ice-cold butter (not 250g — cheese brings fat), 50–75g mature Welsh cheddar, 15–20g Welsh Lady wholegrain mustard whisked into 60–80ml ice-cold Glamorgan pale ale. Optional pinch of cayenne. Welsh egg plus a splash of ale to glaze."},{"q":"Why foil, not ceramic or a barquette?","a":"Because that is how it will be manufactured and how it will sit in the cabinet. Lifting the foil in the tasting shows we are not hiding a soggy base. The sleeve does the luxury job; the foil does the factory job."},{"q":"Can you hit a £2.50 RSP?","a":"Not with 26% Welsh chuck and a cheddar lid. That ticket is the core 235g steak pie. This SKU is a luxury step-up at £3.40–£3.75, or it is a different product. I would rather protect the idea than dilute it."},{"q":"Allergens and claims?","a":"Gluten, milk, egg, mustard, barley from the ale. ‘Welsh beef’ and any Red Tractor / PGI-style claims need pack-off evidence. Nutrition was out of scope on the brief — we will table a full spec after trial."},{"q":"Why Glamorgan ale specifically?","a":"They brew on Llantrisant Business Park, the same site as us. It is a true local bill of materials, not a bought-in ‘craft’ badge, and it gives the gravy a pale-ale bitterness that stands up to cheddar."}]};
const KEY = "welsh-pantry-deck-v2";
let deck = structuredClone(START.deck);
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved?.slides?.length === START.deck.slides.length) deck = saved;
} catch (e) {}
let index = 0;
let presenting = false;
let notesOn = false;

const stage = document.getElementById("stage");
const wrap = document.getElementById("wrap");
const countEl = document.getElementById("count");
const notesEl = document.getElementById("notes");

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(deck)); } catch (e) {}
}
function img(src) { return IMAGES[src] || src || ""; }

function ed(tag, value, path, extraClass) {
  const el = document.createElement(tag);
  el.className = extraClass || "";
  el.contentEditable = presenting ? "false" : "true";
  el.textContent = value;
  el.addEventListener("input", () => {
    const parts = path.split(".");
    let obj = deck.slides[index];
    for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
    obj[parts[parts.length - 1]] = el.textContent;
    save();
  });
  return el;
}

function logo(light) {
  const d = document.createElement("div");
  d.style.cssText = "display:flex;align-items:center;gap:10px";
  d.innerHTML = '<div class="brand-mark">W</div><div><div class="brand-name" style="color:' + (light ? "var(--paper)" : "var(--ink)") + '">The Welsh Pantry</div><div class="brand-sub">Llantrisant</div></div>';
  return d;
}

function footer(slide, i) {
  const f = document.createElement("div");
  f.className = "foot";
  f.innerHTML = "<span>The Welsh Pantry  ·  Retail NPD</span><span>" + String(i+1).padStart(2,"0") + " / " + String(deck.slides.length).padStart(2,"0") + "</span>";
  return f;
}

function bullets(slide) {
  const ul = document.createElement("ul");
  ul.className = "bullets";
  slide.bullets.forEach((b, i) => {
    const li = document.createElement("li");
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = String(i + 1).padStart(2, "0");
    li.append(n, ed("span", b, "bullets." + i));
    ul.append(li);
  });
  return ul;
}

function renderSlide(slide, i) {
  const root = document.createElement("article");
  root.className = "slide " + slide.theme;
  const layout = slide.layout;

  if (layout === "title") {
    const g = document.createElement("div");
    g.className = "title-grid";
    const copy = document.createElement("div");
    copy.className = "title-copy";
    const top = document.createElement("div");
    top.append(logo(true));
    const mid = document.createElement("div");
    mid.append(ed("p", slide.kicker, "kicker", "kicker"));
    mid.append(ed("h1", slide.title, "title"));
    const rule = document.createElement("div"); rule.className = "rule"; mid.append(rule);
    mid.append(ed("p", slide.subtitle, "subtitle", "sub"));
    mid.append(ed("p", slide.body, "body", "body"));
    const facts = document.createElement("div"); facts.className = "facts";
    slide.facts.forEach((f, fi) => {
      const d = document.createElement("div");
      d.append(ed("strong", f.value, "facts." + fi + ".value"));
      d.append(ed("span", f.label, "facts." + fi + ".label"));
      facts.append(d);
    });
    copy.append(top, mid, facts);
    const photo = document.createElement("div"); photo.className = "photo-col";
    photo.innerHTML = '<img class="photo" alt="" /><div class="badge">250g luxury</div>';
    photo.querySelector("img").src = img(slide.image);
    photo.querySelector("img").alt = slide.imageAlt;
    g.append(copy, photo);
    root.append(g);
  } else if (layout === "agenda") {
    const pad = document.createElement("div"); pad.className = "pad";
    pad.append(ed("p", slide.kicker, "kicker", "kicker"));
    pad.append(ed("h1", slide.title, "title"));
    pad.append(ed("p", slide.subtitle, "subtitle", "sub"));
    pad.append(bullets(slide));
    root.append(pad);
  } else if (layout === "pack") {
    const g = document.createElement("div"); g.className = "pack";
    const copy = document.createElement("div"); copy.className = "pack-copy";
    copy.append(ed("p", slide.kicker, "kicker", "kicker"));
    copy.append(ed("h1", slide.title, "title"));
    copy.append(ed("p", slide.subtitle, "subtitle", "sub"));
    copy.append(ed("p", slide.body, "body", "body"));
    copy.append(bullets(slide));
    const vis = document.createElement("div"); vis.className = "pack-visual";
    const im = document.createElement("img"); im.src = img(slide.image); im.alt = slide.imageAlt; vis.append(im);
    g.append(copy, vis); root.append(g);
  } else if (layout === "split" || layout === "factory") {
    const g = document.createElement("div"); g.className = "split";
    const copy = document.createElement("div"); copy.className = "split-copy";
    copy.append(ed("p", slide.kicker, "kicker", "kicker"));
    copy.append(ed("h1", slide.title, "title"));
    copy.append(ed("p", slide.subtitle, "subtitle", "sub"));
    copy.append(bullets(slide));
    if (slide.facts?.length) {
      const fr = document.createElement("div"); fr.className = "factrow";
      slide.facts.forEach((f, fi) => {
        const d = document.createElement("div");
        d.append(ed("strong", f.value, "facts." + fi + ".value"));
        d.append(ed("span", f.label, "facts." + fi + ".label"));
        fr.append(d);
      });
      copy.append(fr);
    }
    const photo = document.createElement("div"); photo.className = "photo-col";
    photo.innerHTML = '<img class="photo" alt="" />';
    photo.querySelector("img").src = img(slide.image);
    photo.querySelector("img").alt = slide.imageAlt;
    g.append(copy, photo); root.append(g);
  } else if (layout === "cards") {
    const pad = document.createElement("div"); pad.className = "pad";
    pad.append(ed("p", slide.kicker, "kicker", "kicker"));
    pad.append(ed("h1", slide.title, "title"));
    pad.append(ed("p", slide.subtitle, "subtitle", "sub"));
    const grid = document.createElement("div"); grid.className = "cards";
    slide.cards.forEach((c, ci) => {
      const card = document.createElement("div"); card.className = "card";
      card.append(ed("p", c.kicker, "cards." + ci + ".kicker", "ck"));
      card.append(ed("h3", c.title, "cards." + ci + ".title"));
      card.append(ed("p", c.body, "cards." + ci + ".body"));
      grid.append(card);
    });
    pad.append(grid); root.append(pad);
  } else if (layout === "quid") {
    const g = document.createElement("div"); g.className = "quid";
    const copy = document.createElement("div"); copy.className = "split-copy";
    copy.append(ed("p", slide.kicker, "kicker", "kicker"));
    copy.append(ed("h1", slide.title, "title"));
    copy.append(ed("p", slide.subtitle, "subtitle", "sub"));
    copy.append(ed("p", slide.body, "body"));
    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>Ingredient</th><th>QUID</th><th>Note</th></tr></thead>";
    const tb = document.createElement("tbody");
    slide.quid.forEach((r, ri) => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); td1.append(ed("span", r.name, "quid." + ri + ".name"));
      const td2 = document.createElement("td"); td2.append(ed("span", r.pct, "quid." + ri + ".pct"));
      const td3 = document.createElement("td"); td3.append(ed("span", r.origin, "quid." + ri + ".origin"));
      tr.append(td1, td2, td3); tb.append(tr);
    });
    table.append(tb); copy.append(table);
    const photo = document.createElement("div"); photo.className = "photo-col";
    photo.innerHTML = '<img class="photo" alt="" />';
    photo.querySelector("img").src = img(slide.image);
    g.append(copy, photo); root.append(g);
  } else if (layout === "table") {
    const pad = document.createElement("div"); pad.className = "pad";
    pad.append(ed("p", slide.kicker, "kicker", "kicker"));
    pad.append(ed("h1", slide.title, "title"));
    pad.append(ed("p", slide.subtitle, "subtitle", "sub"));
    pad.append(ed("p", slide.body, "body"));
    const table = document.createElement("table");
    const thead = document.createElement("thead"); const hr = document.createElement("tr");
    slide.table.headers.forEach((h) => { const th = document.createElement("th"); th.textContent = h; hr.append(th); });
    thead.append(hr); table.append(thead);
    const tb = document.createElement("tbody");
    slide.table.rows.forEach((row, ri) => {
      const tr = document.createElement("tr");
      row.forEach((cell, ci) => {
        const td = document.createElement("td");
        td.append(ed("span", cell, "table.rows." + ri + "." + ci));
        tr.append(td);
      });
      tb.append(tr);
    });
    table.append(tb); pad.append(table); root.append(pad);
  } else if (layout === "close") {
    const g = document.createElement("div"); g.className = "close";
    const copy = document.createElement("div"); copy.className = "close-inner";
    copy.append(ed("p", slide.kicker, "kicker", "kicker"));
    copy.append(ed("h1", slide.title, "title"));
    copy.append(ed("p", slide.subtitle, "subtitle", "sub"));
    copy.append(ed("p", slide.body, "body", "body"));
    copy.append(bullets(slide));
    const photo = document.createElement("div"); photo.className = "photo-col";
    photo.innerHTML = '<img class="photo" alt="" />';
    photo.querySelector("img").src = img(slide.image);
    g.append(copy, photo); root.append(g);
  }
  root.append(footer(slide, i));
  return root;
}

function scale() {
  const r = wrap.getBoundingClientRect();
  const s = Math.min(r.width / 1280, r.height / 720);
  stage.style.transform = "scale(" + s + ")";
  wrap.style.height = (720 * s) + "px";
}

function go(i) {
  index = (i + deck.slides.length) % deck.slides.length;
  stage.innerHTML = "";
  stage.append(renderSlide(deck.slides[index], index));
  countEl.textContent = (index + 1) + " / " + deck.slides.length;
  notesEl.textContent = deck.slides[index].notes;
  notesEl.hidden = !notesOn;
  scale();
}

function present(on) {
  presenting = on;
  document.body.classList.toggle("presenting", on);
  if (on) document.documentElement.requestFullscreen?.().catch(() => {});
  else if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  go(index);
}

document.getElementById("prev").onclick = () => go(index - 1);
document.getElementById("next").onclick = () => go(index + 1);
document.getElementById("hitPrev").onclick = () => go(index - 1);
document.getElementById("hitNext").onclick = () => go(index + 1);
document.getElementById("presentBtn").onclick = () => present(!presenting);
document.getElementById("printBtn").onclick = () => {
  const old = document.getElementById("printAll");
  if (old) old.remove();
  const box = document.createElement("div");
  box.id = "printAll";
  deck.slides.forEach((s, i) => box.append(renderSlide(s, i)));
  document.body.append(box);
  window.print();
};
document.getElementById("notesBtn").onclick = () => { notesOn = !notesOn; notesEl.hidden = !notesOn; notesEl.textContent = deck.slides[index].notes; };
const cribEl = document.getElementById("crib");
const cribList = document.getElementById("cribList");
START.crib.forEach((item) => {
  const dt = document.createElement("dt"); dt.textContent = item.q;
  const dd = document.createElement("dd"); dd.textContent = item.a;
  cribList.append(dt, dd);
});
document.getElementById("cribBtn").onclick = () => { cribEl.hidden = false; };
document.getElementById("cribClose").onclick = () => { cribEl.hidden = true; };

window.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && t.isContentEditable && e.key !== "Escape") return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(index + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(index - 1); }
  if (e.key === "Escape") { cribEl.hidden = true; if (presenting) present(false); }
  if (e.key === "p" && !e.metaKey && !e.ctrlKey) { e.preventDefault(); present(true); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(deck.slides.length - 1);
});

let sx = 0;
stage.addEventListener("touchstart", (e) => { sx = e.changedTouches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) go(index + (dx < 0 ? 1 : -1));
});

new ResizeObserver(scale).observe(wrap);
if (location.hash === "#present" || /present=1/.test(location.search)) present(true);
go(0);
</script>
</body>
</html>
